name: Build KickBob EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KickBob --icon kickbob.ico --add-data "kickbob.ico;." kickbob.py

      - name: Keep the EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KickBob-exe
          path: dist/KickBob.exe

      - name: Publish a GitHub Release (only when the run was started by a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KickBob.exe
            kickbob.py
